<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Page</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #ffffff;
            padding: 20px;
        }

        /* Heading 1 樣式 */
        h1 {
            font-size: 32px;
            font-weight: bold;
            color: #000000;
            text-shadow: 2px 2px 0px #ffc0cb, -1px -1px 0px #ffc0cb, 1px -1px 0px #ffc0cb, -1px 1px 0px #ffc0cb; /* 粉紅色文字陰影/外框感 */
            border-top: 3px solid #000000;
            display: inline-block;
            margin-bottom: 30px;
            padding-top: 2px;
        }

        /* Heading 2 樣式 */
        h2 {
            font-size: 24px;
            font-style: italic;
            font-weight: bold;
            color: #000000;
            border: 2px solid #cccc00; /* 黃綠色/黃色外框 */
            background-color: #ffffcc; /* 淡黃色背景 */
            padding: 5px 10px;
            margin-bottom: 40px;
            width: 95%; /* 橫跨寬度 */
            box-sizing: border-box;
        }

        /* Heading 3 樣式 */
        .h3-container {
            text-align: right; /* 靠右對齊 */
        }

        h3 {
            font-size: 20px;
            font-weight: bold;
            color: #000000;
            text-decoration: underline; /* 下劃線 */
            display: inline-block;
            margin: 0;
        }
    </style>
</head>
<body>

    <h1>This is heading 1</h1>

    <h2>This is heading 2</h2>

    <div class="h3-container">
        <h3>This is heading 3</h3>
    </div>

</body>
</html>
