<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁程式設計課程練習</title>
    <style>
        body {
            font-family: serif;
            padding: 30px;
            background-color: #ffffff;
        }

        /* Heading 1 樣式：頂線 + 文字陰影 */
        h1 {
            border-top: 3px solid black;
            font-family: "Times New Roman", Times, serif;
            font-weight: bold;
            font-size: 2.2rem;
            color: #000;
            text-shadow: 2px 2px 0px #ffb6c1, 4px 4px 0px #ffc0cb;
            padding-top: 5px;
            margin-bottom: 25px;
        }

        /* Heading 2 樣式：黃色底色 + 黑色邊框 + 斜體 */
        h2 {
            border: 2px solid black;
            background-color: #ffff00;
            font-family: "Times New Roman", Times, serif;
            font-style: italic;
            font-weight: normal;
            font-size: 1.8rem;
            color: #000;
            padding: 4px 8px;
            margin-bottom: 25px;
        }

        /* Heading 3 樣式：靠右對齊 + 下劃線 */
        h3 {
            text-align: right;
            font-family: "Times New Roman", Times, serif;
            font-weight: bold;
            font-size: 1.4rem;
            color: #000;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>This is heading 1</h1>

    <h2>This is heading 2</h2>

    <h3>This is heading 3</h3>

</body>
</html>
